services:
  lab06:
    build:
      context: .
      dockerfile: Dockerfile
    image: topic04-lab06:local
    user: "10001:10001"
    environment:
      LAB06_DATABASE: /app/data/lab06.sqlite3
      LAB06_EVIDENCE_DIR: /app/evidence
      LAB06_SECRET_KEY: "${LAB06_SECRET_KEY:-lab06-local-docker-key-not-for-production}"
      LAB06_SIGNING_KEY: "${LAB06_SIGNING_KEY:-lab06-local-signing-key-not-for-production}"
      LAB06_FERNET_KEY: "${LAB06_FERNET_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}"
      LAB06_COOKIE_SECURE: "false"
    # The container process listens on its interface; host publication remains
    # loopback-only, so the service is reachable only from this machine.
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
      - ./report:/app/report
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5006/health', timeout=2)); assert data['status']=='ok'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
