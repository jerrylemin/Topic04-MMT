<div class="presentation-controls" aria-label="Điều khiển trình chiếu">
  <button class="button button-quiet" type="button" data-presentation-toggle aria-pressed="false">Presentation Mode</button>
  <button class="icon-button" type="button" data-trace-action="prev" aria-label="Bước trước">←</button>
  <span class="step-counter" aria-live="polite"><b data-current-step>0</b>/<span data-total-steps>0</span></span>
  <button class="icon-button" type="button" data-trace-action="next" aria-label="Bước sau">→</button>
  <button class="button button-quiet" type="button" data-trace-action="autoplay" aria-pressed="false">Auto Play</button>
  <button class="button button-quiet" type="button" data-trace-action="restart">Chạy lại trace</button>
</div>
