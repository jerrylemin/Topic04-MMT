<div class="presentation-controls" data-presentation-controls aria-label="Điều khiển trình chiếu">
  <button type="button" class="button button-secondary" data-presentation-toggle aria-pressed="false">Presentation Mode</button>
  <button type="button" class="button button-quiet" data-trace-action="prev">Trước</button>
  <span class="presentation-count" aria-live="polite"><b data-current-step>1</b>/<span data-total-steps>0</span></span>
  <button type="button" class="button button-quiet" data-trace-action="next">Sau</button>
  <button type="button" class="button button-quiet" data-trace-action="autoplay">Auto Play</button>
  <button type="button" class="button button-quiet" data-trace-action="pause">Dừng</button>
  <button type="button" class="button button-quiet" data-inspector-open="request">Request</button>
  <button type="button" class="button button-quiet" data-inspector-open="authorization">Authorization</button>
  <button type="button" class="button button-quiet" data-inspector-open="database">Database</button>
  <button type="button" class="button button-quiet" data-inspector-open="code">Code</button>
</div>
