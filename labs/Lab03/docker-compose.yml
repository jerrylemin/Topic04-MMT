services:
  lab03:
    build: .
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      SESSION_COOKIE_SECURE: "false"
      DATABASE_PATH: /app/data/lab03.db
      LAB03_BIND_HOST: "0.0.0.0"
      LAB03_SECRET_KEY: "${LAB03_SECRET_KEY:-lab03-local-docker-demo-key-not-for-production}"
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
      - ./report:/app/report
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
