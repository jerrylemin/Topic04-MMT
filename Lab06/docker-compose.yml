services:
  lab06:
    build:
      context: .
      dockerfile: Dockerfile
    image: topic04-lab06:local
    user: "10001:10001"
    environment:
      LAB06_DATABASE: /app/data/lab06.sqlite3
      LAB06_EVIDENCE_DIR: /app/evidence
      LAB06_SECRET_KEY: "${LAB06_SECRET_KEY:?Set LAB06_SECRET_KEY in the local environment}"
      LAB06_SIGNING_KEY: "${LAB06_SIGNING_KEY:?Set LAB06_SIGNING_KEY in the local environment}"
      LAB06_FERNET_KEY: "${LAB06_FERNET_KEY:?Set LAB06_FERNET_KEY in the local environment}"
      LAB06_COOKIE_SECURE: "false"
    # Host publication is loopback-only. Because app.py also binds container
    # loopback, Docker bridge NAT cannot reach it from the host. This is an
    # explicit safety/portability limitation; run scripts are the working route.
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
      - ./report:/app/report
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    privileged: false
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5006/health', timeout=2)); assert data['status']=='ok'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
