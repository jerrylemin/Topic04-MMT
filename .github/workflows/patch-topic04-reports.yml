name: Patch Topic04 reports

on:
  push:
    branches:
      - agent/reduce-report-screenshots

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tooling
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - name: Patch reports and guides
        run: python .github/scripts/patch_topic04_reports.py
      - name: Render all DOCX for QA
        run: |
          mkdir -p qa
          for f in Lab*/report/21127645_LeMinh_21127224_NguyenVuBach_*.docx; do
            lab=$(echo "$f" | cut -d/ -f1)
            mkdir -p "qa/$lab"
            libreoffice --headless --convert-to pdf --outdir "qa/$lab" "$f"
            pdf=$(find "qa/$lab" -maxdepth 1 -name '*.pdf' | head -n 1)
            pdftoppm -png -r 100 "$pdf" "qa/$lab/page"
          done
      - name: Commit report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lab01/HUONG_DAN_CHUP_ANH.md Lab02/HUONG_DAN_CHUP_ANH.md Lab03/HUONG_DAN_CHUP_ANH.md Lab04/HUONG_DAN_CHUP_ANH.md Lab05/HUONG_DAN_CHUP_ANH.md Lab06/HUONG_DAN_CHUP_ANH.md
          git add Lab01/report/*.docx Lab02/report/*.docx Lab03/report/*.docx Lab04/report/*.docx Lab05/report/*.docx Lab06/report/*.docx
          git commit -m "reduce lab report screenshot requirements" || exit 0
          git push origin HEAD
      - name: Upload rendered QA pages
        uses: actions/upload-artifact@v4
        with:
          name: topic04-report-render
          path: qa
          retention-days: 1
